[package]
name = "vmp"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
ratatui = "0.30.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.3"

[[bench]]
name = "engine"
harness = false
